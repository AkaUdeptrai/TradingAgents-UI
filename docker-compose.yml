services:
  tradingagents-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file:
      - path: .env
        required: false
    environment:
      TRADINGAGENTS_UI_HOST: 0.0.0.0
      TRADINGAGENTS_UI_PORT: 8000
      TRADINGAGENTS_UI_STATIC_DIR: /app/frontend/dist
      TRADINGAGENTS_UI_AUTH_DB: /home/appuser/.tradingagents/ui/auth.sqlite3
    volumes:
      - ui_data:/home/appuser/.tradingagents/ui
    ports:
      - "127.0.0.1:${TRADINGAGENTS_UI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true
    profiles:
      - cli

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  ui_data:
  tradingagents_data:
  ollama_data:
