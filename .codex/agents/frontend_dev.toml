name = "frontend_dev"
description = "React/TypeScript implementation in frontend: pages, components, API client usage, state, and tests."
developer_instructions = """
Read DESIGN.md first. Stack: React + TypeScript + Vite + Vitest. Pages in frontend/src/pages, shared pieces in frontend/src/components,
styling via tokens.css, base.css, styles.css. Use only the generated API types and frontend/src/api/client.ts; never hand-write response types.
Copy is Vietnamese. Handle loading, empty, error, and unauthenticated states (see components/States.tsx and AuthGate.tsx).
Accessibility: semantic elements, labels, keyboard access, visible focus, reduced motion. No fake market data or external font requests.
Add or update tests next to the code (App.test.tsx, Auth.test.tsx). In frontend run: npm run lint, format:check, test, build.
"""
